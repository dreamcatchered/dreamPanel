<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Панель управления</title>
    <!-- Favicon и иконки через API -->
    <link rel="icon" type="image/x-icon" href="https://api.dreampartners.online/icons/dreampanel/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="https://api.dreampartners.online/icons/dreampanel/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="https://api.dreampartners.online/icons/dreampanel/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="48x48" href="https://api.dreampartners.online/icons/dreampanel/favicon-48x48.png">
    <link rel="apple-touch-icon" sizes="180x180" href="https://api.dreampartners.online/icons/dreampanel/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="https://api.dreampartners.online/icons/dreampanel/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="https://api.dreampartners.online/icons/dreampanel/android-chrome-512x512.png">
    <link href="/static/fonts/manrope.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
            background: #ffffff;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .login-header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background: #ffffff;
            color: #1a1a1a;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #1a1a1a;
        }

        .btn {
            width: 100%;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            color: #ffffff;
            background: #1a1a1a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #333;
        }

        .btn:active {
            background: #000;
        }

        .error-message {
            margin-top: 16px;
            padding: 12px;
            background: #fee;
            border: 1px solid #fcc;
            border-radius: 8px;
            color: #c00;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .demo-badge {
            margin-top: 16px;
            padding: 8px 12px;
            background: #f0f7ff;
            border: 1px solid #b3d9ff;
            border-radius: 6px;
            color: #0066cc;
            font-size: 12px;
            text-align: center;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 32px 24px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Панель управления</h1>
            <p>Войдите для доступа к системе</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" required autocomplete="username" value="admin">
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" value="demo">
            </div>

            <button type="submit" class="btn">Войти</button>

            <div class="error-message" id="errorMessage"></div>

            <div class="demo-badge">
                🎭 Демо-версия панели управления
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.classList.remove('show');

            // Простая проверка для демо (любой пароль подходит)
            if (username === 'admin') {
                // Сохраняем в sessionStorage для демо
                sessionStorage.setItem('authenticated', 'true');
                window.location.href = '/demo/dashboard.html';
            } else {
                errorDiv.textContent = 'Неверное имя пользователя';
                errorDiv.classList.add('show');
            }
        });
    </script>
</body>
</html>
